name: PR Build

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build all targets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use official Gradle distribution in CI
        run: sed -i 's#mirrors\.aliyun\.com/macports/distfiles/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build all targets
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: ./gradlew buildAndCollect --stacktrace
